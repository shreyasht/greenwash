name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest  # Maven is preinstalled, so the fixture suite runs here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: install dev extras (coverage.py)
        run: python -m pip install -e ".[dev]"
      - name: unit + hermetic e2e + Maven fixtures, under coverage
        run: coverage run -m unittest discover -s tests -v
      - name: coverage report (fails the job under the pyproject threshold)
        run: |
          coverage report
          coverage xml
          coverage html
          {
            echo '## Coverage'
            echo
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
      - name: upload to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
