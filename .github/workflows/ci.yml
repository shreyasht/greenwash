name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest  # Maven is preinstalled, so the fixture suite runs here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: unit + hermetic e2e + Maven fixtures
        run: python -m unittest discover -s tests -v
