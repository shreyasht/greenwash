[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "astroturf"
dynamic = ["version"]
description = "Deterministic verification for AI coding agents: did it fix the source, or just hack the tests?"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shreyash" }]
keywords = [
    "reward-hacking",
    "coding-agents",
    "ci",
    "testing",
    "verification",
    "code-review",
    "llm",
    "maven",
    "gradle",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []  # stdlib only (NFR-3)

[project.scripts]
astroturf = "astroturf.cli:_console"
astroturf-stop-hook = "astroturf.stophook:_console"

[project.urls]
Homepage = "https://github.com/shreyasht/astroturf"
Repository = "https://github.com/shreyasht/astroturf"
Issues = "https://github.com/shreyasht/astroturf/issues"
Changelog = "https://github.com/shreyasht/astroturf/blob/main/BUILD_PLAN.md"

[tool.setuptools]
packages = ["astroturf"]

[tool.setuptools.dynamic]
version = { attr = "astroturf.__version__" }
