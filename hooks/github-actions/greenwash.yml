# greenwash CI check (FR-35). Copy to .github/workflows/ in the repo you want to guard.
#
# Fails the job on FIX_IS_IN_THE_TESTS or CONFIG_WEAKENED (greenwash exit 1); every other
# verdict is informational (exit 0). Adjust the java-version / build tooling to match your
# project.
name: greenwash

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # greenwash needs base..head

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install greenwash
        run: pip install "git+https://github.com/shreyasht/greenwash@main"

      - name: Verify the diff
        run: |
          status=0
          greenwash \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}" \
            --json > greenwash-report.json || status=$?
          cat greenwash-report.json
          exit $status
