# https://docs.codecov.com/docs/codecov-yaml
coverage:
  status:
    project:
      default:
        target: auto        # compare against the parent commit
        threshold: 1%        # allow a 1-point drop without failing
    patch:
      default:
        target: 85%          # new/changed lines should be well covered

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

ignore:
  - "tests/"
  - "tools/"
  - "fixtures/"
  - "astroturf/__main__.py"
